# 控制器配置示例（开发环境）
listen_addr: "0.0.0.0:60039"
# 内部接口监听（节点 Agent / SSH Guard / HA 内部状态查询）。
# 为空表示不启用内部独立端口；建议生产配置为 192.0.2.x:60040 并启用 TLS。
internal_listen_addr: ""
internal_tls_cert_file: ""
internal_tls_key_file: ""

# PostgreSQL DSN
database_dsn: "postgres://gpuops:gpuops@127.0.0.1:5432/gpuops?sslmode=disable"

# Agent 上报鉴权（header: X-Agent-Token）
agent_token: "<replace-with-agent-token>"
# Agent token 轮换窗口：先把旧 token 放这里，待所有节点更新后清空。
agent_legacy_tokens: []
# 每个计算节点的专属 token。迁移流程：
# 1) 先填 agent_node_tokens，并保持 agent_node_token_enforce=false；
# 2) 用 NODE_AGENT_TOKENS_FILE 下发到节点；
# 3) 确认全部节点上报正常后，改为 true 并重启控制器。
agent_node_token_enforce: false
agent_node_tokens: {}

# 管理员鉴权（header: Authorization: Bearer <token>）
admin_token: "<replace-with-admin-token>"

# Web 登录会话签名密钥（用于 cookie）。建议上线时替换为强随机值。
auth_secret: "<replace-with-auth-secret>"

# 余额阈值
warning_threshold: 100
limited_threshold: 3

# CPU 计费（按“核分钟”计费：100% CPU ≈ 1 核）
# 优先从数据库 resource_prices 中读取模型 "CPU_CORE"；不存在时使用该兜底值
cpu_price_per_core_minute: 0.02

# 采样间隔（秒）：用于按上报周期折算费用；若 Agent 上报携带 interval_seconds，则以 Agent 为准
sample_interval_seconds: 60

# 是否启用 CPU 控制（通过 systemd/cgroup v2 对用户 slice 施加 CPUQuota）
enable_cpu_control: true
cpu_limit_percent_limited: 50
cpu_limit_percent_blocked: 10
# 超过每月欠费上限后，对用户施加内存上限（单位：GB；0 表示关闭）
overdraft_memory_limit_gb: 8

# 欠费后宽限期（秒）：到期后才下发 kill
kill_grace_period_seconds: 600

# 试运行模式：只记录不扣费
dry_run: false

# Web 登录会话有效期（小时）；0 表示禁用登录会话（仅支持 admin_token）
session_hours: 8

# 是否强制 cookie secure（HTTPS 下建议 true；HTTP 调试可 false）
cookie_secure: false

# 密码找回邮件默认配置（也可在管理员 Web 页面中在线配置）
smtp_host: ""
smtp_port: 587
smtp_user: ""
smtp_pass: ""
from_email: ""
from_name: "GPU Ops 团队"

# 默认余额（首次见到的新用户）
default_balance: 100

# 单价兜底（数据库找不到型号时）
default_price_per_minute: 0.1

# 迁移目录（为空时自动探测 ../database/migrations）
migration_dir: ""

# Web 静态文件目录（为空时自动探测 ../web/dist；不存在则不启用）
web_dir: ""

# 容灾（主备控制器）配置
ha_enabled: true
ha_node: "controller-primary"
ha_role: "primary"
ha_peer_url: "http://<standby-controller-ip>:60039"
ha_token: "<replace-with-ha-token>"

# 共享工作目录（控制器直接在 NFS 服务端本地路径创建/chown 用户目录）
shared_node_root: "/srv/gpu-ops/nodes"
shared_cluster_root: "/srv/gpu-ops/cluster"
