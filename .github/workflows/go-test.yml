name: go-test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: go-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: |
            controller/go.sum
            node-agent/go.sum

      - name: 运行静态检查（多模块）
        run: go vet ./controller/... ./node-agent/...

      - name: 运行测试（多模块）
        run: go test ./controller/... ./node-agent/...

  web-build:
    name: Web 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.20.0"

      - name: 安装 pnpm
        run: npm install --global pnpm@10.28.2

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Web
        run: pnpm build
