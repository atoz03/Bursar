version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/controller"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "gomod"
    directory: "/node-agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # vue-tsc 3.3.x cannot load TypeScript 7's package exports yet.
      - dependency-name: "typescript"
        versions:
          - "7.x"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
